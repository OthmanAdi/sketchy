<!doctype html>
<html lang="en" class="sk" data-theme="day">
<head>
<meta charset="utf-8">
<title>Deck tile</title>
<link rel="stylesheet" href="../../skills/sketchy/engine/sketchy.css">
<style>
  /* README gallery tile for the deck: four real slides of templates/deck.html, 2 x 2.
     render.mjs captures _build/deck-N.png first. */
  html, body { margin: 0; width: 1600px; height: 1000px; overflow: hidden; }
  body.sk { min-height: 0; padding: 0; background-attachment: scroll; display: grid; grid-template-columns: 1fr 1fr; gap: 30px 34px; padding: 40px 46px; box-sizing: border-box; align-content: center; }
  img { width: 100%; display: block; box-shadow: 0 2px 3px rgba(var(--sk-shadow), .2), 0 14px 24px -12px rgba(var(--sk-shadow), .55); }
  img:nth-child(1) { transform: rotate(-1deg); } img:nth-child(2) { transform: rotate(.7deg); }
  img:nth-child(3) { transform: rotate(.5deg); } img:nth-child(4) { transform: rotate(-.8deg); }
</style>
</head>
<body class="sk">
  <img src="_build/deck-1.png" alt=""><img src="_build/deck-3.png" alt=""><img src="_build/deck-6.png" alt=""><img src="_build/deck-8.png" alt="">
  <script src="../../skills/sketchy/engine/sketchy.js"></script>
  <script>Sketchy.config.boil = false; Sketchy.mount();</script>
</body>
</html>
