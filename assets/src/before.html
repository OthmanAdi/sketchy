<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The default deck</title>
<style>
  /* A faithful "default AI deck" slide, for the README before/after image only. */
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff;
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%); display: grid; place-items: center; }
  .card { width: 1500px; padding: 90px 110px; border-radius: 36px; background: rgba(255, 255, 255, .12); backdrop-filter: blur(20px); box-shadow: 0 40px 80px rgba(0, 0, 0, .25); border: 1px solid rgba(255, 255, 255, .25); }
  h1 { font-size: 104px; margin: 0 0 30px; font-weight: 800; letter-spacing: -.02em; }
  .accent { width: 140px; height: 10px; border-radius: 6px; background: #fbbf24; margin-bottom: 54px; }
  ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 34px; font-size: 52px; font-weight: 500; }
  li span { margin-right: 26px; }
</style>
</head>
<body>
  <div class="card">
    <h1>🚀 Q3 Results</h1>
    <div class="accent"></div>
    <ul>
      <li><span>📈</span>Strong growth across all key metrics</li>
      <li><span>✅</span>Improved operational efficiency</li>
      <li><span>💡</span>Exciting opportunities ahead</li>
    </ul>
  </div>
</body>
</html>
