<!doctype html>
<html lang="en" class="sk" data-theme="day">
<head>
<meta charset="utf-8">
<title>Before and after</title>
<link rel="stylesheet" href="../../skills/sketchy/engine/sketchy.css">
<style>
  /* Composite for the README: the default deck next to the same message in sketchy.
     render.mjs captures _build/before.png and _build/after.png first. */
  html, body { margin: 0; width: 1600px; height: 560px; overflow: hidden; }
  body.sk { min-height: 0; padding: 0; background-attachment: scroll; display: grid; grid-template-columns: 1fr 1fr; gap: 44px; padding: 34px 40px 30px; box-sizing: border-box; }
  figure { margin: 0; display: grid; gap: 10px; justify-items: center; }
  img { width: 100%; display: block; box-shadow: 0 2px 3px rgba(var(--sk-shadow), .2), 0 18px 30px -14px rgba(var(--sk-shadow), .55); }
  .before img { transform: rotate(-1.2deg); }
  .after img { transform: rotate(.8deg); }
  figcaption { font: 600 34px/1 var(--sk-font-hand); }
  .before figcaption { text-decoration: line-through; text-decoration-color: var(--sk-red); text-decoration-thickness: 3px; opacity: .8; }
</style>
</head>
<body class="sk">
  <figure class="before"><img src="_build/before.png" alt=""><figcaption>the default deck</figcaption></figure>
  <figure class="after"><img src="_build/after.png" alt=""><figcaption>the same page, sketchy</figcaption></figure>
  <script src="../../skills/sketchy/engine/sketchy.js"></script>
  <script>Sketchy.config.boil = false; Sketchy.mount();</script>
</body>
</html>
