name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Repository checks
        run: node scripts/check-skill.mjs

      - name: Syntax check scripts
        run: node --check scripts/check-skill.mjs

      - name: Syntax check every .js and .mjs file under skills/
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
            count=$((count + 1))
          done < <(find skills \( -name '*.js' -o -name '*.mjs' \) -not -path '*/node_modules/*' -print0)
          echo "checked $count files"
          if [ "$count" -eq 0 ]; then
            echo "no .js or .mjs files found under skills/" >&2
            exit 1
          fi
